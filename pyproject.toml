[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macro-sentinel"
version = "0.1.0"
description = "Autonomous Macroeconomic & Central Bank Intelligence Engine"
readme = "README.md"
authors = [{ name = "Dario" }]
license = { text = "MIT" }
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "apscheduler>=3.10.4",
    "google-genai>=0.1.1",
    "litellm>=1.40.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "jinja2>=3.1.3",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.1",
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.12.3",
    "tenacity>=8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[project.scripts]
macro-sentinel = "macro_sentinel.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"
